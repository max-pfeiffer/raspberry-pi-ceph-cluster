---
# --- Ceph release -----------------------------------------------------------
# Pin an exact release. To upgrade, print the values for a new release with
# `scripts/ceph-release-pins.sh <version>`, update all three, then run `make upgrade`.
ceph_version: "21.2.0"
cephadm_sha256: "f494ef67601f5888d72dd26b4f8cc941cc86deac69300e8b81607878d051b516"
# Multi-arch image index digest of quay.io/ceph/ceph:v{{ ceph_version }}.
ceph_image_digest: "sha256:c9e6ed4ac3fcf67b28f38358bb9619dee4d1dfb96ddd4b9b583eee316a15f04d"
ceph_image: "quay.io/ceph/ceph@{{ ceph_image_digest }}"

# --- Tooling ----------------------------------------------------------------
cephadm_path: /usr/local/sbin/cephadm
ceph_shell: "{{ cephadm_path }} shell --"

# --- Dashboard --------------------------------------------------------------
ceph_dashboard_user: admin
ceph_dashboard_password: "{{ vault_ceph_dashboard_password }}"

# --- OSDs -------------------------------------------------------------------
# One cephadm OSD service per disk model, so nodes can use SSDs from different
# vendors. An empty disk becomes an OSD when its model contains `model`
# (case-sensitive substring, as cephadm matches it). Each node must have exactly
# one matching disk. Find the model with `lsblk -d -o NAME,MODEL` or
# `ceph orch device ls`. Don't change the service_id of a service that already
# has OSDs; add an entry for a new model instead, e.g.:
#   - service_id: nvme-samsung
#     data_devices:
#       model: "Samsung SSD 990 PRO 1TB"
ceph_osd_services:
  - service_id: nvme
    data_devices:
      model: "KINGSTON SNV3S1000G"   # Kingston NV3 1 TB

# --- Placement labels -------------------------------------------------------
# All nodes are admin nodes (hold ceph.conf + admin keyring) and run MON, MGR and
# OSD. Memory-heavy extras are split: monitoring on ceph1, MDS on ceph2 + ceph3.
ceph_host_labels: [_admin, mon, mgr, osd]
ceph_host_extra_labels: []

# --- Maintenance ------------------------------------------------------------
# Health checks tolerated when waiting for a healthy cluster before/after a
# disruptive change (firmware, network, reboots), e.g. [POOL_NO_REDUNDANCY].
ceph_health_allowed_checks: []

# --- Kubernetes clusters ----------------------------------------------------
# Each Kubernetes cluster is a tenant with its own RBD pool, CephFS subvolume
# group and data pool, and its own Ceph users. Quotas keep one cluster from
# filling the Ceph cluster for all others; their sum must stay below the usable
# capacity (about 780 GiB). The users' keys only exist in Ceph, never in the
# repo: hand them to the Kubernetes clusters as described in the README.
# Don't rename a cluster that has volumes: the pools and users are named after it.
ceph_k8s_clusters:
  - name: production
    rbd_quota_gib: 200
    cephfs_quota_gib: 100
  - name: test
    rbd_quota_gib: 200
    cephfs_quota_gib: 100
