---
# --- Access -----------------------------------------------------------------
admin_user: ansible
ansible_user: "{{ admin_user }}"
# Public key(s) authorized for admin_user via cloud-init.
admin_ssh_public_keys:
  - "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') }}"

# --- General ----------------------------------------------------------------
domain: internal
timezone: Etc/UTC

# --- Network (UGREEN 2.5 GbE USB adapter) -----------------------------------
# The only network: Ceph public network (clients, MONs, OSD replication) plus SSH
# and management. There is no separate Ceph cluster network; the onboard eth0
# stays unconfigured.
# Ubuntu names USB NICs enx<mac>; each node has exactly one, so it is matched by
# name pattern and no per-host MAC is needed.
public_interface_match: "enx*"
public_network: 192.168.30.0/24
public_gateway: 192.168.30.1
public_mtu: 1500
dns_servers:
  - 192.168.30.1

# --- Firewall ---------------------------------------------------------------
# Networks that may reach every TCP port (Ceph, dashboard, Grafana, Prometheus).
# Replaces the role default, so public_network must stay in the list.
firewall_allowed_networks:
  - "{{ public_network }}"
  - 192.168.1.0/24   # workstation LAN
