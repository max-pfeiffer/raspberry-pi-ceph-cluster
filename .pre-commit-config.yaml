---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: \.j2$
      - id: detect-private-key
  # The linters run from the uv environment (`make deps`), so their versions
  # are pinned in one place (uv.lock) and match `make lint` and CI.
  - repo: local
    hooks:
      - id: vault-encrypted
        name: vault.yml is encrypted
        entry: scripts/check-vault-encrypted.sh
        language: script
        files: (^|/)vault\.yml$
      - id: yamllint
        name: yamllint
        entry: uv run --no-sync yamllint
        language: system
        types: [yaml]
      - id: ansible-lint
        name: ansible-lint
        entry: uv run --no-sync ansible-lint
        language: system
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: actionlint
        entry: uv run --no-sync actionlint
        language: system
        files: ^\.github/workflows/
      - id: shellcheck
        name: shellcheck
        entry: uv run --no-sync shellcheck
        language: system
        types: [shell]
