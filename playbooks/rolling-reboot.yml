---
# Reboots nodes one at a time (e.g. after kernel updates). Requires a healthy
# cluster to start, waits for recovery after each node, and always clears noout.
- name: Select admin node
  ansible.builtin.import_playbook: select-admin.yml

- name: Rolling reboot
  hosts: ceph_admin
  become: true
  tasks:
    - name: Require a healthy cluster before starting
      ansible.builtin.include_role:
        name: ceph_maintenance
        tasks_from: wait_healthy
      vars:
        ceph_maintenance_peer: "{{ inventory_hostname }}"
        # Tolerate a noout flag left behind by an interrupted earlier run.
        ceph_maintenance_allowed_checks: "{{ ceph_health_allowed_checks + ['OSDMAP_FLAGS'] }}"
        ceph_maintenance_retries: 1

    - name: Reboot nodes with noout set
      block:
        - name: Set noout
          ansible.builtin.command: "{{ ceph_shell }} ceph osd set noout"
          changed_when: true

        - name: Reboot each node
          ansible.builtin.include_role:
            name: ceph_maintenance
            tasks_from: reboot_node
          loop: "{{ groups['ceph'] }}"
          loop_control:
            loop_var: ceph_maintenance_node
      always:
        - name: Unset noout
          ansible.builtin.command: "{{ ceph_shell }} ceph osd unset noout"
          changed_when: true
