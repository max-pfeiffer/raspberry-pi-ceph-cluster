---
# Reboots nodes one at a time (e.g. after kernel updates). Requires a healthy
# cluster to start, waits for recovery after each node, and always clears noout.
# With --limit only the matching nodes are rebooted.
- name: Select admin node
  ansible.builtin.import_playbook: select-admin.yml

- name: Rolling reboot
  hosts: ceph_admin
  become: true
  tasks:
    - name: Require a healthy cluster before starting
      ansible.builtin.include_role:
        name: ceph_maintenance
        tasks_from: wait_healthy
      vars:
        # Tolerate a noout flag left behind by an interrupted earlier run.
        ceph_maintenance_allowed_checks: "{{ ceph_health_allowed_checks + ['OSDMAP_FLAGS'] }}"
        ceph_maintenance_retries: 1

    - name: Reboot nodes with noout set
      block:
        - name: Set noout
          ansible.builtin.command: "{{ ceph_shell }} ceph osd set noout"
          changed_when: true

        - name: Reboot each node
          ansible.builtin.include_role:
            name: ceph_maintenance
            tasks_from: reboot_node
          loop: "{{ groups['ceph'] | select('in', query('ansible.builtin.inventory_hostnames', ansible_limit | default('all'))) }}"
          loop_control:
            loop_var: ceph_maintenance_node
      always:
        # Tried from every node: the admin node itself is rebooted too and may
        # be the one that didn't come back.
        - name: Unset noout
          ansible.builtin.command: "{{ ceph_shell }} ceph --connect-timeout 30 osd unset noout"
          delegate_to: "{{ item }}"
          loop: "{{ groups['ceph'] }}"
          register: _unset_noout
          ignore_unreachable: true
          failed_when: false
          changed_when: _unset_noout.rc | default(1) == 0

        - name: Ensure noout was unset
          ansible.builtin.assert:
            that: _unset_noout.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list | length > 0
            fail_msg: "noout is still set. Run `ceph osd unset noout` once a node is reachable."
            quiet: true
