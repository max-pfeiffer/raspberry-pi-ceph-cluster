---
- name: Select admin node
  ansible.builtin.import_playbook: select-admin.yml

- name: Bootstrap Ceph (only if no cluster exists yet on any node)
  hosts: ceph_admin
  become: true
  tasks:
    - name: Bootstrap
      ansible.builtin.include_role:
        name: ceph_cluster
        tasks_from: bootstrap

# In check mode nothing is bootstrapped, so without a cluster there is nothing
# to compare against and the remaining plays are skipped.
- name: Authorize cephadm on all nodes
  hosts: ceph
  become: true
  tasks:
    - name: Authorize cephadm SSH key
      ansible.builtin.include_role:
        name: ceph_cluster
        tasks_from: authorize
      when: ceph_cluster_fsids | length > 0 or not ansible_check_mode

- name: Converge Ceph services, configuration, pools and file systems
  hosts: ceph_admin
  become: true
  tasks:
    - name: Converge cluster
      ansible.builtin.include_role:
        name: ceph_cluster
        tasks_from: converge
      when: ceph_cluster_fsids | length > 0 or not ansible_check_mode
