---
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # Validators for the rendered files. `make test` requires them in CI.
      - name: Install cloud-init and netplan
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends cloud-init netplan.io
      # Same entry points as locally: installs the locked environment, then lints
      # and renders the templates. Neither needs the vault password.
      - name: Lint
        run: make deps lint
      - name: Test
        run: make test
      # The cephadm checksum and image digest in the inventory must belong to
      # the pinned ceph_version (asks download.ceph.com and quay.io).
      - name: Check the Ceph release pins
        run: make check-pins

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The whole history is scanned, not only the latest commit.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
