---
name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running test of the same branch obsolete.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the real playbooks against the runner and builds a single-node Ceph
  # cluster on it (see tests/integration/run.sh). arm64, like the Raspberry Pis.
  single-node:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Install the environment
        run: make deps
      - name: Run the integration test
        run: tests/integration/run.sh
      - name: Collect diagnostics
        if: failure()
        run: |
          sudo /usr/local/sbin/cephadm shell -- ceph status || true
          sudo /usr/local/sbin/cephadm shell -- ceph health detail || true
          sudo /usr/local/sbin/cephadm shell -- ceph orch ps || true
          sudo /usr/local/sbin/cephadm shell -- ceph log last 100 info cephadm || true
          sudo /usr/local/sbin/cephadm ls --no-detail || true
          sudo lsblk || true
          sudo ufw status verbose || true
          sudo journalctl --no-pager --since "-60min" --priority warning | tail -n 300 || true
