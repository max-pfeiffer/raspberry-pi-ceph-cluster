---
# Reloading alone would apply the rules only when the adapter is plugged in
# again, so the attribute is also set on adapters that are already there.
# Written to sysfs directly rather than with `udevadm trigger`: replaying an
# "add" event on the node's only network link is not worth the risk.
- name: Reload udev
  ansible.builtin.shell: |
    set -eu
    udevadm control --reload-rules
    for dev in /sys/bus/usb/devices/*; do
      [ -f "$dev/idVendor" ] && [ -f "$dev/power/control" ] || continue
      case " {{ _usb_nic_ids }} " in
        *" $(cat "$dev/idVendor"):$(cat "$dev/idProduct") "*) echo on > "$dev/power/control" ;;
      esac
    done
  vars:
    _usb_nic_ids: "{{ network_usb_nic_ids | map(attribute='vendor') | zip(network_usb_nic_ids | map(attribute='product')) | map('join', ':') | join(' ') }}"
  changed_when: true
