---
# Writes the configuration but doesn't apply it. Sets network_apply_pending;
# the caller applies it with tasks_from: apply (see playbooks/20-network.yml).

# netplan would assign the same IP to every interface matching the pattern.
- name: Ensure exactly one interface matches {{ public_interface_match }}
  ansible.builtin.assert:
    that: _matching | length == 1
    fail_msg: "Expected one interface matching '{{ public_interface_match }}', found {{ _matching }}."
  vars:
    _matching: "{{ ansible_facts.interfaces | select('match', '^' ~ (public_interface_match | replace('*', '.*')) ~ '$') | list }}"

- name: Disable USB autosuspend for the 2.5 GbE adapter
  ansible.builtin.template:
    src: 70-usb-nic-power.rules.j2
    dest: /etc/udev/rules.d/70-usb-nic-power.rules
    mode: "0644"
  notify: Reload udev

- name: Write netplan configuration
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: "{{ network_netplan_file }}"
    mode: "0600"
  register: _netplan

- name: Stop cloud-init from managing the network
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    mode: "0644"

- name: Remove cloud-init generated netplan file
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  register: _netplan_cloud_init

# The marker lives on tmpfs: it survives a failed or interrupted run, so the
# pending apply isn't forgotten, and disappears with a reboot (which applies
# the configuration anyway).
- name: Remember that the netplan configuration must be applied
  ansible.builtin.file:
    path: "{{ network_apply_marker }}"
    state: touch
    mode: "0644"
  when: _netplan is changed or _netplan_cloud_init is changed

- name: Check for a pending netplan apply
  ansible.builtin.stat:
    path: "{{ network_apply_marker }}"
  register: _network_apply_marker

- name: Record whether the netplan configuration must be applied
  ansible.builtin.set_fact:
    network_apply_pending: "{{ _network_apply_marker.stat.exists or _netplan is changed or _netplan_cloud_init is changed }}"
