---
ceph_specs_dir: /etc/ceph/specs

# Show output of tasks that handle secrets (bootstrap). Only for troubleshooting:
# `make ceph ANSIBLE_ARGS="-e ceph_debug=true"`.
ceph_debug: false

ceph_mgr_count: 2
ceph_mds_count: 2
ceph_monitoring_enabled: true
# Prometheus memory grows with retained samples; keep history short on 8 GB nodes.
ceph_prometheus_retention_time: 7d
# Webhooks that receive alerts from Alertmanager, e.g. an ntfy or Slack bridge.
# Without any, alerts are only visible in the dashboard and the Alertmanager UI.
ceph_alertmanager_webhook_urls: []
# Creates the Grafana admin user when Grafana is first deployed. Without it
# Grafana has no admin user and is read-only (anonymous viewer access).
ceph_grafana_admin_password: "{{ vault_ceph_grafana_password | default('') }}"

# Memory budget per 8 GB node: OSD + MON + MGR on every node, plus the monitoring
# stack on ceph1 and the MDS daemons on ceph2/ceph3 (see placement labels).
# An entry that is deleted from this list stays set in the cluster; remove it
# there with `ceph config rm <who> <option>`.
ceph_config:
  - { who: osd, option: osd_memory_target_autotune, value: "false" }
  - { who: osd, option: osd_memory_target, value: "2684354560" }      # 2.5 GiB
  - { who: mon, option: mon_memory_target, value: "1073741824" }      # 1 GiB
  - { who: mds, option: mds_cache_memory_limit, value: "1073741824" } # 1 GiB
  - { who: mon, option: mon_allow_pool_delete, value: "false" }
# Appended to ceph_config, to add options without repeating the list.
ceph_config_extra: []

# Replicated RBD pools (size 3 / min_size 2 are the Ceph defaults).
ceph_rbd_pools:
  - name: rbd

# CephFS file systems. `ceph fs volume create` creates the metadata/data pools.
ceph_filesystems:
  - name: cephfs

ceph_expected_osds: "{{ groups['ceph'] | length }}"
