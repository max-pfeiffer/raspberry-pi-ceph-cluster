---
# Configures the firmware but doesn't reboot. Sets rpi_firmware_reboot_pending;
# the caller reboots with tasks_from: reboot (see playbooks/00-firmware.yml).
- name: Install Raspberry Pi firmware tools
  ansible.builtin.apt:
    name: rpi-eeprom
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Manage config.txt settings
  ansible.builtin.blockinfile:
    path: "{{ rpi_config_txt }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (rpi_firmware)"
    state: "{{ 'present' if rpi_config_txt_lines else 'absent' }}"
    insertafter: EOF
    block: |
      [all]
      {{ rpi_config_txt_lines | join('\n') }}
  register: _rpi_config_txt

- name: Manage bootloader EEPROM
  when: rpi_manage_eeprom
  block:
    - name: Read current EEPROM configuration
      ansible.builtin.command: rpi-eeprom-config
      register: _eeprom
      changed_when: false
      check_mode: false

    - name: Determine whether EEPROM settings differ
      ansible.builtin.set_fact:
        _eeprom_needs_update: >-
          {%- set ns = namespace(diff=false) -%}
          {%- for k, v in rpi_eeprom_config.items() -%}
          {%- if (k ~ '=' ~ v) not in _eeprom.stdout_lines -%}{%- set ns.diff = true -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.diff }}

    - name: Write desired EEPROM configuration
      ansible.builtin.copy:
        dest: /run/eeprom-desired.conf
        mode: "0600"
        content: |
          {% for line in _eeprom.stdout_lines if line.split('=')[0] not in rpi_eeprom_config %}
          {{ line }}
          {% endfor %}
          {% for k, v in rpi_eeprom_config.items() %}
          {{ k }}={{ v }}
          {% endfor %}
      when: _eeprom_needs_update | bool

    - name: Apply EEPROM configuration (takes effect after reboot)
      ansible.builtin.command: rpi-eeprom-config --apply /run/eeprom-desired.conf
      register: _eeprom_apply
      when: _eeprom_needs_update | bool
      changed_when: true

# The marker lives on tmpfs: it survives a failed or interrupted run, so the
# pending reboot isn't forgotten, and disappears with the reboot.
- name: Remember that a reboot is pending
  ansible.builtin.file:
    path: "{{ rpi_reboot_marker }}"
    state: touch
    mode: "0644"
  when: _rpi_config_txt is changed or _eeprom_apply is changed

- name: Check for a pending reboot
  ansible.builtin.stat:
    path: "{{ rpi_reboot_marker }}"
  register: _rpi_reboot_marker

- name: Record whether a reboot is pending
  ansible.builtin.set_fact:
    rpi_firmware_reboot_pending: >-
      {{ _rpi_reboot_marker.stat.exists or _rpi_config_txt is changed
         or (rpi_manage_eeprom and _eeprom_needs_update | default(false) | bool) }}
