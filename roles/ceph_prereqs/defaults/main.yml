---
cephadm_url: "https://download.ceph.com/rpm-{{ ceph_version }}/el9/noarch/cephadm"

# Ubuntu releases that Ceph tests as a container host for the pinned ceph_version
# (https://docs.ceph.com/en/latest/start/os-recommendations/). Review the list
# when changing ceph_version to a new major release.
ceph_prereqs_supported_ubuntu: ["22.04", "24.04"]

ceph_prereq_packages:
  - podman
  - lvm2
  - python3

# Verify that exactly one disk matches the models in ceph_osd_services and that
# it isn't the root disk. Only disabled by the CI integration test, whose OSD is
# a logical volume.
ceph_prereqs_check_osd_disk: true
ceph_prereqs_osd_models: >-
  {{ ceph_osd_services | map(attribute='data_devices')
     | selectattr('model', 'defined') | map(attribute='model') | list }}

# DANGER: when true, OSD disks (matched by ceph_prereqs_osd_models) are wiped.
# Refused on nodes that run Ceph daemons or have a ceph.conf.
wipe_osd_disks: false
# DANGER: also wipe a disk that holds Ceph OSD data (LVM volume group "ceph-*").
# Such a disk may be a live OSD of an existing cluster whose node was
# re-flashed; `ceph cephadm osd activate <host>` brings it back without data loss.
wipe_osd_disks_force: false
