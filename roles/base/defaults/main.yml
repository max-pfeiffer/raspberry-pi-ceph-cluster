---
base_packages:
  - chrony  # with Ubuntu's default configuration
  - curl
  - ca-certificates
  - gdisk
  - jq
  - lvm2
  - python3
  - ufw
  - unattended-upgrades

# Security updates are installed automatically, but nodes never reboot on their
# own. Reboot with `make reboot`, which keeps the cluster healthy.
base_unattended_reboot: false
# One hour apart per node (ceph1 03:00, ceph2 04:00, ...), in the node's timezone.
base_upgrade_time: "{{ '%02d:00' | format(3 + groups['ceph'].index(inventory_hostname)) }}"

firewall_enabled: true
# Networks that may reach every TCP port: Ceph, dashboard and monitoring. The
# trust boundary is the network, so there is no list of Ceph ports to maintain.
firewall_allowed_networks:
  - "{{ public_network }}"
# Sources allowed to reach SSH. The default is open, because narrowing it can
# lock you out: make sure the list covers your workstation AND the cluster nodes
# (cephadm connects between them), e.g. ["{{ public_network }}", 192.168.1.0/24].
# Once `any` is no longer in the list, the open rule is deleted.
firewall_ssh_allowed_networks:
  - any
