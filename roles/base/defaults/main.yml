---
base_packages:
  - chrony
  - curl
  - ca-certificates
  - gdisk
  - jq
  - lvm2
  - python3
  - ufw
  - unattended-upgrades

# Security updates are installed automatically, but nodes never reboot on their
# own. Reboot with `make reboot`, which keeps the cluster healthy.
base_unattended_reboot: false

firewall_enabled: true
# Networks allowed to reach Ceph and monitoring services.
firewall_allowed_networks:
  - "{{ public_network }}"
firewall_ceph_ports:
  - "3300"        # mon msgr2
  - "6789"        # mon msgr1
  - "6800:7568"   # osd, mgr, mds
  - "8443"        # dashboard
  - "8765"        # cephadm service discovery
  - "9283"        # mgr prometheus exporter
  - "9100"        # node-exporter
  - "9926"        # ceph-exporter
  - "9095"        # prometheus
  - "3000"        # grafana
  - "9093:9094"   # alertmanager
