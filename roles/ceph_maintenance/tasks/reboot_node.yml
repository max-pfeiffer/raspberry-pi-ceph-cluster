---
# Reboots ceph_maintenance_node and waits for the cluster to recover.
- name: Check that the orchestrator considers it safe to stop {{ ceph_maintenance_node }}
  ansible.builtin.command: "{{ ceph_shell }} ceph orch host ok-to-stop {{ ceph_maintenance_node }}"
  changed_when: false
  check_mode: false

- name: Reboot {{ ceph_maintenance_node }}
  ansible.builtin.reboot:
    reboot_timeout: 900
  delegate_to: "{{ ceph_maintenance_node }}"

- name: Wait for the cluster to recover from rebooting {{ ceph_maintenance_node }}
  ansible.builtin.include_tasks: wait_healthy.yml
  vars:
    ceph_maintenance_peers: "{{ groups['ceph'] | difference([ceph_maintenance_node]) + [ceph_maintenance_node] }}"
    ceph_maintenance_allowed_checks: "{{ ceph_health_allowed_checks + ['OSDMAP_FLAGS'] }}"
